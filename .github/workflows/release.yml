name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # node 24 ships with npm 11.x out of the box, which has full
          # Trusted Publisher OIDC handshake support (npm 10.x doesn't).
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @loquix/core exec playwright install --with-deps chromium webkit

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Wait for the registry to serve the published version
        if: steps.changesets.outputs.published == 'true'
        run: |
          # changeset publish returns as soon as npm accepts the upload, but the
          # registry replica a consumer hits can still be serving the previous
          # version for up to a minute. Dispatching before then makes the website
          # deploy fail on ERR_PNPM_NO_MATCHING_VERSION.
          VERSION='${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].version }}'

          for attempt in $(seq 1 30); do
            if npm view "@loquix/core@$VERSION" version --prefer-online >/dev/null 2>&1; then
              echo "@loquix/core@$VERSION is resolvable after $attempt attempt(s)"
              exit 0
            fi
            sleep 10
          done

          echo "::error::@loquix/core@$VERSION was still not resolvable after five minutes"
          exit 1

      - name: Trigger website deploy
        if: steps.changesets.outputs.published == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          repository: loquix-dev/website
          event-type: loquix-released
          client-payload: |
            {
              "version": "${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].version }}",
              "ref": "${{ github.sha }}"
            }
