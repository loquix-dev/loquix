name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # node 24 ships with npm 11.x out of the box, which has full
          # Trusted Publisher OIDC handshake support (npm 10.x doesn't).
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @loquix/core exec playwright install --with-deps chromium webkit

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Wait for the registry to serve the published versions
        id: published
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail

          # changeset publish returns as soon as npm accepts the upload, but the
          # registry replica a consumer hits can still be serving the previous
          # version for up to a minute. Dispatching before then makes the website
          # deploy fail on ERR_PNPM_NO_MATCHING_VERSION.
          #
          # Every published package is waited for by name. Reading the name from
          # the payload rather than assuming @loquix/core matters as soon as a
          # package can publish on its own: pairing core's name with another
          # package's version polls a release that will never exist.
          packages=()
          while IFS= read -r line; do
            packages+=("$line")
          done < <(echo "$PUBLISHED" | jq -r '.[] | "\(.name)@\(.version)"')

          for pkg in "${packages[@]}"; do
            for attempt in $(seq 1 30); do
              if npm view "$pkg" version --prefer-online >/dev/null 2>&1; then
                echo "$pkg is resolvable after $attempt attempt(s)"
                continue 2
              fi
              sleep 10
            done

            echo "::error::$pkg was still not resolvable after five minutes"
            exit 1
          done

          # The website pins @loquix/core specifically, so it needs that package's
          # version rather than whichever entry happens to come first. A release
          # that does not include core must not dispatch at all: passing another
          # package's version would install a real but older core and commit the
          # downgrade.
          core_version=$(echo "$PUBLISHED" | jq -r '.[] | select(.name == "@loquix/core") | .version')
          echo "core_version=$core_version" >> "$GITHUB_OUTPUT"

          if [ -z "$core_version" ]; then
            echo "@loquix/core was not part of this release; skipping the website deploy"
          fi

      - name: Trigger website deploy
        if: steps.changesets.outputs.published == 'true' && steps.published.outputs.core_version != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          repository: loquix-dev/website
          event-type: loquix-released
          client-payload: |
            {
              "version": "${{ steps.published.outputs.core_version }}",
              "ref": "${{ github.sha }}"
            }
